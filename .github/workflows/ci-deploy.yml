name: CI & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue rather than cancel so a running
# deployment finishes cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The browser tests are the only ones that can catch a broken MapLibre
      # worker or a wrong base path, so they are not optional here.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Run the browser tests at the exact base path this repository deploys
      # to, so a base-path mistake fails CI rather than production.
      - name: Run browser tests
        run: npm run test:e2e
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build for GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      # Derived from the repository name rather than hardcoded, so renaming the
      # repo cannot silently produce a build whose asset URLs all 404.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # Hash routing means every real route lives after '#', but a stray path
      # such as /opentrack-viewer/settings would otherwise hit the Pages 404 page.
      # Serving the app there lets it recover instead.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
